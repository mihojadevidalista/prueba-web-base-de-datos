<script>
  // URL de la versión pública de tu Google Sheet
  const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vScJgTawvb8Xt4ihxUbMXBJCr6FO5XSPwDq92qggbXq-yr3wySu434_STias-giNTd3YFt8eN8fcN6d/pub?gid=0&single=true&output=csv';

  let projectsData = [];

  // Elementos DOM
  const grid = document.getElementById('resourceGrid');
  const searchInput = document.getElementById('searchInput');
  const selectPeriodo = document.getElementById('filterPeriodo');
  const selectAsignatura = document.getElementById('filterAsignatura');
  const selectRegional = document.getElementById('filterRegional');

  // Cargar datos CSV directamente desde Google Sheets
  async function fetchSheetData() {
    try {
      const response = await fetch(SHEET_URL);
      if (!response.ok) throw new Error('No se pudo acceder a la hoja');
      
      const csvText = await response.text();
      projectsData = parseCSV(csvText);

      populateFilterOptions();
      renderCards(projectsData);
      setupEventListeners();
    } catch (error) {
      console.error('Error al cargar la base de datos:', error);
      grid.innerHTML = '<div class="no-results">Error al cargar la base de datos. Asegúrate de que la hoja de Google Sheets esté compartida como pública.</div>';
    }
  }

  // Parser de CSV resistente
  function parseCSV(text) {
    const lines = text.trim().split(/\r?\n/);
    if (lines.length < 2) return [];

    // Extraer encabezados limpia comillas
    const headers = parseCSVLine(lines[0]);

    return lines.slice(1).map(line => {
      const values = parseCSVLine(line);
      const obj = {};

      headers.forEach((header, index) => {
        const cleanHeader = header.trim();
        const val = values[index] ? values[index].trim() : '';

        // Mapear encabezados dinámicamente según lo que esté en el Excel
        if (/ID/i.test(cleanHeader)) obj.id = val;
        else if (/Proyecto/i.test(cleanHeader)) obj.proyecto = val;
        else if (/Periodo/i.test(cleanHeader)) obj.periodo = val;
        else if (/Asignatura/i.test(cleanHeader)) obj.asignatura = val;
        else if (/Regional/i.test(cleanHeader)) obj.regional = val;
        else if (/Temas/i.test(cleanHeader)) obj.temas = val;
        else if (/URL/i.test(cleanHeader)) obj.url = val;
      });
      return obj;
    });
  }

  // Función auxiliar para leer comas dentro de comillas
  function parseCSVLine(line) {
    const result = [];
    let start = 0;
    let inQuotes = false;

    for (let i = 0; i < line.length; i++) {
      if (line[i] === '"') {
        inQuotes = !inQuotes;
      } else if (line[i] === ',' && !inQuotes) {
        let val = line.substring(start, i).trim();
        if (val.startsWith('"') && val.endsWith('"')) val = val.slice(1, -1);
        result.push(val);
        start = i + 1;
      }
    }
    let lastVal = line.substring(start).trim();
    if (lastVal.startsWith('"') && lastVal.endsWith('"')) lastVal = lastVal.slice(1, -1);
    result.push(lastVal);

    return result;
  }

  // Llenar selects de filtros con datos únicos
  function populateFilterOptions() {
    const periodos = [...new Set(projectsData.map(item => item.periodo).filter(Boolean))];
    const asignaturas = [...new Set(projectsData.map(item => item.asignatura).filter(Boolean))];
    const regionales = [...new Set(projectsData.map(item => item.regional).filter(Boolean))];

    periodos.forEach(p => selectPeriodo.add(new Option(p, p)));
    asignaturas.forEach(a => selectAsignatura.add(new Option(a, a)));
    regionales.forEach(r => selectRegional.add(new Option(r, r)));
  }

  // Configurar listeners
  function setupEventListeners() {
    searchInput.addEventListener('input', filterData);
    selectPeriodo.addEventListener('change', filterData);
    selectAsignatura.addEventListener('change', filterData);
    selectRegional.addEventListener('change', filterData);
  }

  // Filtrar la grilla dinámicamente
  function filterData() {
    const query = searchInput.value.toLowerCase().trim();
    const selectedPeriodo = selectPeriodo.value;
    const selectedAsignatura = selectAsignatura.value;
    const selectedRegional = selectRegional.value;

    const filtered = projectsData.filter(item => {
      const matchesSearch = (item.proyecto && item.proyecto.toLowerCase().includes(query)) || 
                            (item.temas && item.temas.toLowerCase().includes(query));

      const matchesPeriodo = !selectedPeriodo || item.periodo === selectedPeriodo;
      const matchesAsignatura = !selectedAsignatura || item.asignatura === selectedAsignatura;
      const matchesRegional = !selectedRegional || item.regional === selectedRegional;

      return matchesSearch && matchesPeriodo && matchesAsignatura && matchesRegional;
    });

    renderCards(filtered);
  }

  // Renderizar tarjetas
  function renderCards(data) {
    grid.innerHTML = '';

    if (data.length === 0) {
      grid.innerHTML = '<div class="no-results">No se encontraron resultados que coincidan con los filtros aplicados.</div>';
      return;
    }

    data.forEach(item => {
      const temasArray = item.temas ? item.temas.split(',').map(t => t.trim()) : [];
      const tagsHtml = temasArray.map(t => `<span class="badge">${t}</span>`).join('');

      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div>
          <h3>${item.proyecto || 'Sin Nombre'}</h3>
          <div class="meta-info">
            <strong>Periodo:</strong> ${item.periodo || 'N/A'}<br>
            <strong>Asignatura:</strong> ${item.asignatura || 'N/A'}<br>
            <strong>Regional:</strong> ${item.regional || 'N/A'}
          </div>
          <div class="tags">${tagsHtml}</div>
        </div>
        <a href="${item.url || '#'}" target="_blank" rel="noopener noreferrer" class="btn-link">Ver Recurso / Contenido</a>
      `;
      grid.appendChild(card);
    });
  }

  // Iniciar la petición al cargar
  fetchSheetData();
</script>
