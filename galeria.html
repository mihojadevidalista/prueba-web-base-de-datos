<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Galería virtual</title>
<style>
:root{--ac:#34701a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#1b1b1b;font-family:system-ui,sans-serif}
[hidden]{display:none!important}
/* Anti-selección: al arrastrar en modo libre no se selecciona texto/imágenes (sombreado azul) */
html,body,#esc,#css3d,#mundo,.e,#tit,#hud{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#esc canvas,.p img{-webkit-user-drag:none;user-drag:none;pointer-events:auto}
.p img{pointer-events:none}
::selection{background:transparent}
#esc,#css3d{position:fixed;inset:0;touch-action:none}
#esc canvas{display:block;width:100%;height:100%}
#css3d{display:none;overflow:hidden}
#mundo{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d}
.e{position:absolute;left:0;top:0;transform-origin:0 0;transform-style:preserve-3d}
.p{border:8px solid #2a2a2a;box-sizing:content-box;background:#ddd;display:flex;align-items:center;justify-content:center;font:600 16px system-ui;color:#555;cursor:pointer}
.p img{width:100%;height:100%;display:block}
.t{background:#fff;border-left:6px solid var(--ac);padding:3px 8px;font:13px/15px system-ui;color:#555;overflow:hidden;display:flex;flex-direction:column;justify-content:center}
.t b,.t i{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-style:normal}
.t b{font-size:15px;line-height:18px;color:#222}
.t b.l{font-size:12.5px}
#vis{position:fixed;left:8px;right:8px;z-index:5;display:flex;flex-direction:column;align-items:center;background:#000d;border-radius:10px;padding:6px}
#vis .vh{width:100%;display:flex;justify-content:flex-end;padding-bottom:6px}
#vis button{min-height:36px;padding:6px 14px;font-size:15px}
#vis iframe{flex:1;min-height:0;width:min(100%,1100px);border:0;background:#fff;border-radius:6px}
#tit{position:fixed;top:0;left:0;right:0;padding:10px 14px;background:#000b;color:#fff;font-size:15px;pointer-events:none}
#hud{position:fixed;left:0;right:0;bottom:0;padding:12px;pointer-events:none;background:linear-gradient(transparent,#000c)}
#ctl{pointer-events:auto;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;color:#fff;font-size:16px}
button{font:600 17px system-ui;padding:12px 18px;min-height:48px;border:0;border-radius:10px;background:var(--ac);color:#fff;cursor:pointer}
button:focus-visible{outline:3px solid #fff}
@media(max-width:600px){#ctl{gap:6px;font-size:14px}button{font-size:14px;padding:8px 12px;min-height:40px}#tit{font-size:13px;padding:8px 10px}}
#cargando,#fin{position:fixed;inset:0;z-index:9;display:flex;flex-direction:column;gap:16px;align-items:center;justify-content:center;color:#fff;text-align:center;padding:20px;font-size:18px}
#cargando{background:#1b1b1b}#fin{background:#000a}
#barra{width:min(320px,80%);height:8px;background:#444;border-radius:4px;overflow:hidden;display:none}
#prog{display:block;height:100%;width:0;background:var(--ac)}
</style></head><body>
<div id="esc"></div><div id="css3d"></div>
<div id="tit"></div>
<div id="hud"><div id="ctl">
<button id="bA">‹ Anterior</button><button id="bP">⏸ Pausa</button><button id="bS">Siguiente ›</button><button id="bR">⟲ Reiniciar</button>
<span id="cnt"></span><label><input type="checkbox" id="lib"> Modo libre</label><button id="pdf" hidden>Abrir PDF completo</button>
</div></div>
<div id="fin" hidden><div>Fin del recorrido</div><div><button id="fi">Volver al inicio</button> <button id="fc">Cerrar</button></div></div>
<div id="cargando"><div id="msg">Cargando galería…</div><div id="barra"><i id="prog"></i></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ===== CONFIGURACIÓN (editable) ===== */
const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQWHCJEyBaIdAw63qinCRnxEZUL-vy7vA5oFzVP5O6chwwIviLD0Sx7bjL3nNAlrHk5IkIuSbH1RL4q/pub?gid=2139860041&single=true&output=csv';
const GALERIA_API_URL = 'https://script.google.com/macros/s/AKfycbwNowG18i3zvMteBAzqDxXkDhzFgepY936-IiimtpThrNJQRoW6ruQSGqpT5K36ag/exec';
const MAX_ARCHIVOS = 24;
const SEGUNDOS_POR_OBRA = 6;
const COLORES = { acento:'#34701a', pared:'#ece9e2', piso:'#8a8578', techo:'#f6f5f2' };
/* ===== FIN CONFIGURACIÓN ===== */

// Seguridad: todo texto externo se muestra con textContent / canvas (nunca innerHTML).
const $ = id => document.getElementById(id);
const movil = matchMedia('(max-width:800px)').matches;
const SZ = movil ? 1024 : 1600, DPR = Math.min(devicePixelRatio || 1, 2);
const W = 4, H = 3.2, S = 100, K = 0.866; // medio ancho de sala, alto, px por unidad, 1/(2·tan30°)
document.documentElement.style.setProperty('--ac', COLORES.acento);
let obras = [], info = {}, modo = 'webgl', R, zMin, cur = 0, play = true, zoom = false, libre = false;
let espera = 0, yo = 0, po = 0, moved = false;
const cam = { x: 0, y: 1.6, z: 2, yaw: 0 };
let rsvT = 0, rsvB = 0; // alto de la barra superior e inferior (se descuenta del área visible)
const medir = () => { rsvT = $('tit').offsetHeight; rsvB = $('hud').offsetHeight; };

const msg = t => { $('msg').textContent = t; $('barra').style.display = 'none'; $('cargando').style.display = 'flex'; };
const httpOk = u => /^https?:\/\//i.test(u);
const idCarpeta = u => { const m = /\/folders\/([\w-]{10,})/.exec(u) || /[?&]id=([\w-]{10,})/.exec(u); return m ? m[1] : null; };
const urlImg = a => 'https://drive.google.com/thumbnail?id=' + a.id + '&sz=w' + SZ;
// Clasifica cada archivo: 'gif' (animado), 'video' (mp4), 'pdf' o '' (imagen normal)
const clase = a => { const n = (a.name || '').toLowerCase(), m = (a.mimeType || '').toLowerCase(), t = (a.tipo || '').toLowerCase();
  if (t == 'pdf' || /pdf/.test(m) || /\.pdf$/.test(n)) return 'pdf';
  if (t == 'gif' || /gif/.test(m) || /\.gif$/.test(n)) return 'gif';
  if (t == 'video' || /^video\//.test(m) || /\.(mp4|m4v|mov|webm)$/.test(n)) return 'video';
  return ''; };
const urlsGif = a => ['https://drive.google.com/uc?export=view&id=' + a.id, 'https://lh3.googleusercontent.com/d/' + a.id];
const recorta = (t, n) => (t || '').length > n ? t.slice(0, n - 1) + '…' : (t || '');

// Lector CSV (soporta comillas y comas dentro de celdas)
function csv(t) {
  const r = []; let f = '', w = [], q = 0;
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (q) { if (c == '"') { if (t[i + 1] == '"') { f += '"'; i++; } else q = 0; } else f += c; }
    else if (c == '"') q = 1;
    else if (c == ',') { w.push(f); f = ''; }
    else if (c == '\n') { w.push(f); r.push(w); w = []; f = ''; }
    else if (c != '\r') f += c;
  }
  w.push(f); r.push(w); return r;
}

const err = m => Object.assign(new Error(m), { u: 1 });
async function traer(u, que) { // descarga con límite de 20 s para no quedarse cargando para siempre
  const c = new AbortController(), t = setTimeout(() => c.abort(), 20000);
  try { const x = await fetch(u, { signal: c.signal }); if (!x.ok) throw 0; return await x.text(); }
  catch (e) { throw err('No se pudo leer ' + que + '. Revisa el enlace y tu conexión.'); }
  finally { clearTimeout(t); }
}
async function iniciar() {
  try {
    const p = new URLSearchParams(location.search).get('proyecto');
    if (!p) return msg('Falta indicar el proyecto. Usa una dirección como galeria.html?proyecto=12');
    if (!httpOk(SHEET_URL) || !httpOk(GALERIA_API_URL)) return msg('La galería aún no está configurada.');
    const filas = csv(await traer(SHEET_URL, 'el Sheet publicado'));
    const f = filas.find(x => (x[0] || '').trim() === p.trim()); // columna A = id
    if (!f) return msg('No encontramos el proyecto ' + p + '.');
    const id = idCarpeta(f[17] || ''); // columna R = galeria
    if (!id) return msg('Este proyecto todavía no tiene galería.');
    info = { titulo: f[1] || 'Proyecto', est: [f[2], f[3], f[4]].filter(x => x && x.trim()).join(', '), pers: [f[2], f[3], f[4]].filter(x => x && x.trim()).map(x => x.trim()) };
    let r;
    try { r = JSON.parse(await traer(GALERIA_API_URL + '?folder=' + id, 'el script de la galería')); }
    catch (e) { return msg(e.u ? e.message : 'El script de la galería no devolvió datos válidos. Impleméntalo como aplicación web con acceso "Cualquier persona" y autoriza los permisos.'); }
    if (!r.ok) return msg('No pudimos leer la carpeta: ' + r.error);
    obras = (r.archivos || []).filter(a => /^[\w-]{10,}$/.test(a.id)).slice(0, MAX_ARCHIVOS);
    if (!obras.length) return msg('La carpeta está vacía o no tiene JPG, PNG o PDF válidos.');
    obras.forEach(a => a.k = clase(a));
    await cargarImagenes();
    arrancar();
  } catch (e) { console.error(e); msg(e.u ? e.message : 'Ocurrió un problema al cargar la galería. Intenta de nuevo más tarde.'); }
}

function cargar(a, cors, url) {
  return new Promise(ok => { const i = new Image(); if (cors) i.crossOrigin = 'anonymous';
    setTimeout(() => ok(null), 20000); i.onload = () => ok(i); i.onerror = () => ok(null); i.src = url || urlImg(a); });
}
// Estrategia CORS: primero con crossOrigin (sirve para WebGL); si TODAS fallan, reintenta sin él y usa modo CSS 3D.
async function cargarImagenes() {
  $('barra').style.display = 'block'; let n = 0;
  const paso = () => { $('prog').style.width = (++n / obras.length * 100) + '%'; };
  // GIF, PDF y MP4 solo se muestran bien en el modo HTML/CSS 3D (el GIF se anima y PDF/MP4 van en visor incrustado)
  if (obras.some(a => a.k)) modo = 'css';
  await Promise.all(obras.map(async a => {
    if (a.k == 'gif') { for (const u of urlsGif(a)) { a.img = await cargar(a, false, u); if (a.img) break; } if (!a.img) a.img = await cargar(a, false); }
    else a.img = await cargar(a, modo != 'css'); // PDF/MP4: la miniatura sirve de portada y para calcular la proporción
    paso(); }));
  const fallo = obras.filter(a => !a.img);
  if (fallo.length) { // alguna falló por CORS: se reintenta sin CORS y se usa el modo CSS 3D para todas
    modo = 'css';
    await Promise.all(fallo.map(async a => { a.img = await cargar(a, false); }));
  }
}

function arrancar() {
  obras.forEach((a, i) => {
    a.i = i; a.lado = i % 2 ? 1 : -1; a.z = -3 - Math.floor(i / 2) * 5; // izquierda/derecha alternando
    const r = a.img ? a.img.width / a.img.height : a.k == 'video' ? 16 / 9 : a.k == 'pdf' ? .77 : 0;
    if (r) { a.w = Math.min(3.2, 2.2 * r); a.h = a.w / r; } else { a.w = 2.2; a.h = 1.6; }
  });
  obras.forEach(a => { a.y = Math.max(1.6, a.h / 2 + .85); }); // altura del centro: sube las obras altas para que la placa no se hunda en el piso
  zMin = -(Math.floor((obras.length - 1) / 2) * 5 + 6);
  R = null;
  if (modo == 'webgl' && window.THREE) { try { R = webgl(); } catch (e) { console.warn('WebGL no disponible', e); } }
  if (!R) { modo = 'css'; R = css(); }
  console.info('Modo activo:', modo);
  $('cargando').style.display = 'none';
  $('tit').textContent = info.titulo + (info.est ? ' — ' + info.est : '');
  R.resize(); goTo(0);
  requestAnimationFrame(t => { last = t; bucle(t); });
}

/* ---------- Modo A: WebGL (Three.js) ---------- */
function tarjeta(l1, l2) {
  const c = document.createElement('canvas'); c.width = 512; c.height = 128; const g = c.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, 512, 128); g.fillStyle = COLORES.acento; g.fillRect(0, 0, 10, 128);
  g.fillStyle = '#222'; g.font = 'bold 30px system-ui,sans-serif'; g.fillText(recorta(l1, 32), 26, 52);
  g.fillStyle = '#555'; g.font = '22px system-ui,sans-serif'; g.fillText(recorta(l2, 44), 26, 92);
  return new THREE.CanvasTexture(c);
}
// Placa con el nombre del proyecto y hasta 3 participantes (cada uno en su línea, con ajuste de tamaño para que quepa)
function placa(tit, pers) {
  const c = document.createElement('canvas'); c.width = 1024; c.height = 256; const g = c.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, 1024, 256); g.fillStyle = COLORES.acento; g.fillRect(0, 0, 14, 256);
  const filas = [{ t: tit || '', b: 'bold ', f: 40, c: '#222', h: 56 }].concat((pers || []).slice(0, 3).map(p => ({ t: p, b: '', f: 32, c: '#555', h: 44 })));
  const maxw = 1024 - 14 - 36; let y = (256 - filas.reduce((s, r) => s + r.h, 0)) / 2;
  filas.forEach(r => {
    let f = r.f, t = r.t; const fn = () => { g.font = r.b + f + 'px system-ui,sans-serif'; return g.measureText(t).width; };
    while (fn() > maxw && f > 20) f -= 2;
    while (fn() > maxw && t.length > 4) t = t.slice(0, -2) + '…';
    g.fillStyle = r.c; g.fillText(t, 30, y + r.h * .75); y += r.h;
  });
  return new THREE.CanvasTexture(c);
}
function webgl() {
  const r = new THREE.WebGLRenderer({ antialias: !movil }); // lanza error si no hay WebGL
  r.setPixelRatio(DPR); $('esc').appendChild(r.domElement);
  const sc = new THREE.Scene(); sc.background = new THREE.Color('#1b1b1b');
  const cm = new THREE.PerspectiveCamera(60, 1, .1, 200); cm.rotation.order = 'YXZ';
  sc.add(new THREE.HemisphereLight(0xffffff, 0x999999, 1));
  const luz = new THREE.PointLight(0xffffff, .5, 14); sc.add(luz);
  const L = 2 - zMin, zc = (2 + zMin) / 2, pics = [];
  const mat = c => new THREE.MeshLambertMaterial({ color: c });
  const pl = (w, h, m, x, y, z, ry, rx) => { const o = new THREE.Mesh(new THREE.PlaneGeometry(w, h), m); o.position.set(x, y, z); o.rotation.set(rx || 0, ry || 0, 0); sc.add(o); return o; };
  pl(2 * W, L, mat(COLORES.piso), 0, 0, zc, 0, -Math.PI / 2);
  pl(2 * W, L, mat(COLORES.techo), 0, H, zc, 0, Math.PI / 2);
  pl(L, H, mat(COLORES.pared), -W, H / 2, zc, Math.PI / 2);
  pl(L, H, mat(COLORES.pared), W, H / 2, zc, -Math.PI / 2);
  pl(2 * W, H, mat(COLORES.pared), 0, H / 2, zMin, 0);
  pl(2 * W, H, mat(COLORES.pared), 0, H / 2, 2, Math.PI);
  obras.forEach(a => {
    const ry = -a.lado * Math.PI / 2, px = o => a.lado * (W - o);
    pl(a.w + .16, a.h + .16, mat('#2a2a2a'), px(.01), a.y, a.z, ry);
    let t;
    if (a.img) { t = new THREE.Texture(a.img); t.needsUpdate = true; } else t = tarjeta('No se pudo cargar', '');
    const m = pl(a.w, a.h, new THREE.MeshBasicMaterial({ map: t }), px(.02), a.y, a.z, ry);
    m.userData.i = a.i; pics.push(m);
    pl(2.9, .725, new THREE.MeshBasicMaterial({ map: placa(info.titulo, info.pers) }), px(.02), a.y - a.h / 2 - .44, a.z, ry);
  });
  const rc = new THREE.Raycaster();
  return {
    resize() { r.setSize(innerWidth, innerHeight); cm.aspect = innerWidth / innerHeight; cm.updateProjectionMatrix(); },
    draw(c) { cm.position.set(c.x, c.y, c.z); cm.rotation.set(po, c.yaw + yo, 0); luz.position.copy(cm.position); r.render(sc, cm); },
    pick(ev) { rc.setFromCamera(new THREE.Vector2(ev.clientX / innerWidth * 2 - 1, -(ev.clientY / innerHeight) * 2 + 1), cm);
      const h = rc.intersectObjects(pics)[0]; return h ? h.object.userData.i : -1; },
    free() { sc.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material) { if (o.material.map) o.material.map.dispose(); o.material.dispose(); } }); r.dispose(); }
  };
}

/* ---------- Modo B: HTML/CSS 3D (sin restricción CORS) ---------- */
function css() {
  const e = $('css3d'); e.style.display = 'block';
  const m = document.createElement('div'); m.id = 'mundo'; e.appendChild(m);
  let P = 600;
  const L = 2 - zMin, zc = (2 + zMin) / 2, dd = {}, ifr = { i: -1, el: null };
  const caja = (w, h, x, y, z, ry, rx, cls, bg) => {
    const d = document.createElement('div'); d.className = 'e ' + cls;
    d.style.cssText = `width:${w * S}px;height:${h * S}px;${bg ? 'background:' + bg + ';' : ''}transform:translate3d(${x * S}px,${-y * S}px,${z * S}px) rotateY(${ry || 0}rad) rotateX(${rx || 0}rad) translate(-50%,-50%)`;
    m.appendChild(d); return d;
  };
  caja(2 * W, L, 0, 0, zc, 0, Math.PI / 2, '', COLORES.piso);
  caja(2 * W, L, 0, H, zc, 0, Math.PI / 2, '', COLORES.techo);
  caja(L, H, -W, H / 2, zc, Math.PI / 2, 0, '', COLORES.pared);
  caja(L, H, W, H / 2, zc, -Math.PI / 2, 0, '', COLORES.pared);
  caja(2 * W, H, 0, H / 2, zMin, 0, 0, '', COLORES.pared);
  caja(2 * W, H, 0, H / 2, 2, Math.PI, 0, '', COLORES.pared);
  obras.forEach(a => {
    const ry = -a.lado * Math.PI / 2, x = a.lado * (W - .02);
    const d = caja(a.w, a.h, x, a.y, a.z, ry, 0, 'p');
    if (a.img) { const im = document.createElement('img'); im.src = a.img.src; im.alt = ''; d.appendChild(im); } else d.textContent = a.k == 'video' ? '▶ Video' : a.k == 'pdf' ? 'PDF' : 'No se pudo cargar';
    if (a.k == 'pdf' || a.k == 'video') dd[a.i] = d;
    d.onclick = ev => { ev.stopPropagation(); if (!moved) clic(a.i); };
    const t = caja(2.9, .725, x, a.y - a.h / 2 - .44, a.z, ry, 0, 't');
    const b = document.createElement('b'); b.textContent = info.titulo; if ((info.titulo || '').length > 30) b.className = 'l'; t.appendChild(b);
    (info.pers || []).slice(0, 3).forEach(p => { const n = document.createElement('i'); n.textContent = p; t.appendChild(n); });
  });
  // PDF y MP4: al acercarse a la obra se abre el visor de Drive como capa plana sobre la pantalla (no dentro de la escena 3D),
  // así el video se reproduce y el PDF se desplaza/amplía con mouse o dedo. Se cierra con ✕, Esc o al cambiar de obra.
  function visor() {
    const w = zoom && dd[cur] ? cur : -1;
    if (w != ifr.i) {
      if (ifr.el) { ifr.el.remove(); ifr.el = null; }
      ifr.i = w;
      if (w >= 0) {
        const a = obras[w], v = document.createElement('div'), h = document.createElement('div'), x = document.createElement('button'), f = document.createElement('iframe');
        v.id = 'vis'; h.className = 'vh'; x.textContent = '✕ Cerrar'; x.onclick = () => clic(cur); h.appendChild(x);
        f.src = 'https://drive.google.com/file/d/' + a.id + '/preview'; f.allow = 'autoplay; fullscreen'; f.allowFullscreen = true; f.title = a.name || 'Archivo';
        v.append(h, f); document.body.appendChild(v); ifr.el = v;
      }
    }
    if (ifr.el) { const t = (rsvT + 8) + 'px', bt = (rsvB + 8) + 'px'; if (ifr.el.style.top != t) ifr.el.style.top = t; if (ifr.el.style.bottom != bt) ifr.el.style.bottom = bt; }
  }
  return {
    resize() { P = innerHeight * K; e.style.perspective = P + 'px'; },
    draw(c) { visor(); m.style.transform = `translateZ(${P}px) rotateX(${po}rad) rotateY(${-(c.yaw + yo)}rad) translate3d(${-c.x * S}px,${c.y * S}px,${-c.z * S}px)`; },
    free() { m.remove(); }
  };
}

/* ---------- Recorrido ---------- */
// Encuadre: la distancia se calcula para que el cuadro COMPLETO (y su placa) quepan siempre en el área libre de la pantalla.
function pose(i) {
  const a = obras[i], asp = innerWidth / innerHeight;
  const f = Math.max(.35, (innerHeight - rsvT - rsvB) / innerHeight); // fracción de alto libre de botones
  const ch = zoom ? a.h + .2 : a.h + .9;                 // alto a mostrar (zoom: solo el cuadro; normal: cuadro + placa)
  const cw = zoom ? a.w + .2 : Math.max(a.w, 2.9) + .3;  // ancho a mostrar
  const yc = a.y - (zoom ? 0 : .33);                          // centro vertical del contenido
  const d = Math.min(7.6, Math.max(1.2, Math.max(ch * K / f, cw / asp * K) * 1.18));
  const y = yc - (rsvB - rsvT) / 2 * (d / K) / innerHeight; // centra el contenido entre las dos barras
  return { x: a.lado * (W - d), y: y, z: a.z, yaw: -a.lado * Math.PI / 2 };
}
function ui() {
  $('cnt').textContent = (cur + 1) + ' / ' + obras.length + ' · ' + (obras[cur].name || '');
  $('bP').textContent = play ? '⏸ Pausa' : '▶ Reanudar';
  $('pdf').hidden = obras[cur].tipo != 'pdf'; medir();
}
function goTo(i) { cur = Math.max(0, Math.min(obras.length - 1, i)); zoom = false; espera = SEGUNDOS_POR_OBRA + 2; yo = po = 0; $('fin').hidden = true; ui(); }
function fin() { play = false; ui(); $('fin').hidden = false; }
function clic(i) { if (i == cur && zoom) { zoom = false; espera = SEGUNDOS_POR_OBRA; } else { if (i != cur) goTo(i); zoom = true; } }
let last = 0;
function bucle(t) {
  const dt = Math.min((t - last) / 1000, .1); last = t;
  const p = pose(cur), k = 1 - Math.exp(-dt * 2.5);
  cam.x += (p.x - cam.x) * k; cam.y += (p.y - cam.y) * k; cam.z += (p.z - cam.z) * k; cam.yaw += (p.yaw - cam.yaw) * k;
  if (play && !zoom && !libre && !$('fin').hidden === false) {
    espera -= dt; if (espera <= 0) { cur < obras.length - 1 ? goTo(cur + 1) : fin(); }
  }
  R.draw(cam); requestAnimationFrame(bucle);
}

/* ---------- Controles ---------- */
$('bA').onclick = () => goTo(cur - 1);
$('bS').onclick = () => goTo(cur + 1);
$('bP').onclick = () => { play = !play; if (play) espera = SEGUNDOS_POR_OBRA; ui(); };
$('bR').onclick = () => { play = true; goTo(0); };
$('fi').onclick = $('bR').onclick;
$('fc').onclick = () => { $('fin').hidden = true; try { window.close(); } catch (e) {} };
$('pdf').onclick = () => window.open('https://drive.google.com/file/d/' + obras[cur].id + '/view', '_blank', 'noopener');
$('lib').onchange = e => { libre = e.target.checked; if (libre) { play = false; } else yo = po = 0; ui(); };
addEventListener('keydown', e => {
  if (!obras.length) return;
  if (e.key == 'ArrowLeft') goTo(cur - 1); else if (e.key == 'ArrowRight') goTo(cur + 1);
  else if (e.key == ' ') { e.preventDefault(); $('bP').onclick(); }
  else if (e.key == 'Escape' && zoom) clic(cur);
});
// Anti-selección: bloquea selección y arrastre nativo de imágenes sobre la escena
['selectstart', 'dragstart'].forEach(n => addEventListener(n, e => { if (e.target.closest && e.target.closest('#esc,#css3d')) e.preventDefault(); }));
$('esc').addEventListener('mousedown', e => e.preventDefault());
$('css3d').addEventListener('mousedown', e => e.preventDefault());
let drag = null;
$('esc').addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY }; moved = false; });
$('css3d').addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY }; moved = false; });
addEventListener('pointermove', e => {
  if (!drag) return; const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (Math.abs(dx) + Math.abs(dy) > 6) moved = true;
  if (libre) { yo = Math.max(-1.2, Math.min(1.2, yo + dx * .005)); po = Math.max(-.6, Math.min(.6, po + dy * .004)); }
  drag = { x: e.clientX, y: e.clientY };
});
addEventListener('pointerup', () => { drag = null; setTimeout(() => moved = false, 0); });
$('css3d').addEventListener('click', () => { if (!moved && zoom) clic(cur); }); // en modo CSS: clic en el fondo sale del zoom
$('esc').addEventListener('click', e => { if (moved || !R || !R.pick) return; const i = R.pick(e); if (i >= 0) clic(i); else if (zoom) clic(cur); });
addEventListener('resize', () => { medir(); R && R.resize(); });
addEventListener('pagehide', () => R && R.free && R.free()); // libera memoria
iniciar();
</script></body></html>
